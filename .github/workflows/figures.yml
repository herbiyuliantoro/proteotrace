name: tool and figures

# Proves the claim the README makes: the tracked files alone are enough to
# rebuild every main figure, with no download and no local state.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install the package and run the tool end to end
        run: |
          pip install -e .
          proteotrace check \
            --matrix  data/PXD001064_protein_matrix.tsv \
            --samples examples/PXD001064_samples.tsv \
            --out     /tmp/qc
          test -s /tmp/qc/run_report.tsv
      - name: Rebuild every main figure from a clean tree
        run: |
          rm -rf figures
          for f in plot_fig*.py; do echo "== $f"; python "$f"; done
      - name: Check all six were written
        run: |
          count=$(ls figures/*.pdf | wc -l)
          echo "pdf files: $count"
          test "$count" -eq 6
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
